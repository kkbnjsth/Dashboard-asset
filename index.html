<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChaiJaai</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ChaiJaai">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<script src="https://accounts.google.com/gsi/client" async></script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f5f6f7;--surface:#ffffff;--text:#14171a;--muted:#8a9099;--line:#edeff1;
  --accent:#12a150;--on-accent:#ffffff;
  --paid:#12a150;--paid-soft:#e6f6ec;--pending:#e58a00;--pending-soft:#fff3de;--bar:#12a150;
  --shadow:0 1px 2px rgba(20,23,26,.04),0 4px 16px rgba(20,23,26,.04);
  --font:"Poppins","IBM Plex Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1110;--surface:#181c1a;--text:#f2f5f3;--muted:#8c958f;--line:#252a27;
    --accent:#2bc470;--on-accent:#07140d;
    --paid:#2bc470;--paid-soft:#14301f;--pending:#f2a93b;--pending-soft:#33260f;--bar:#2bc470;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1110;--surface:#181c1a;--text:#f2f5f3;--muted:#8c958f;--line:#252a27;
  --accent:#2bc470;--on-accent:#07140d;
  --paid:#2bc470;--paid-soft:#14301f;--pending:#f2a93b;--pending-soft:#33260f;--bar:#2bc470;
  --shadow:none;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 110px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:22px;margin:0;font-weight:600;letter-spacing:-.02em}
.sub{font-size:12px;color:var(--muted);margin-top:1px}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-size:17px}
.icon-btn.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;font-weight:600;color:var(--text)}
.cthumb{width:32px;height:20px;object-fit:cover;border-radius:3px;flex:none;display:block}
.cthumb.sm{width:26px;height:16px}
.strip .nm{display:flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.cyc{display:flex;align-items:center;justify-content:space-between;padding:2px 2px;margin-bottom:12px}
.cyc button{width:38px;height:38px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-size:18px}
.cyc button:disabled{opacity:.35}
.cyc .mid{text-align:center;font-size:14px;font-weight:600}
.cyc .mid small{display:block;color:var(--muted);font-weight:400;font-size:11.5px;margin-top:1px}
@property --hd{syntax:'<percentage>';inherits:false;initial-value:0%}
@property --hm{syntax:'<percentage>';inherits:false;initial-value:60.74%}
@property --hl{syntax:'<percentage>';inherits:false;initial-value:100%}
@property --scr{syntax:'<number>';inherits:false;initial-value:.4}
@property --hmc{syntax:'<color>';inherits:false;initial-value:#12A85F}
.hero{position:relative;--hd:0%;--hm:60.74%;--hl:100%;--scr:.4;--hmc:#12A85F;background:linear-gradient(90deg,rgba(4,60,52,var(--scr)) 0%,rgba(4,60,52,var(--scr)) 45%,rgba(4,60,52,0) 80%),linear-gradient(90deg,#055B4E var(--hd),var(--hmc) var(--hm),#EBFF69 var(--hl));color:#fff;border-radius:24px;padding:20px 20px 18px;margin-bottom:14px;box-shadow:0 10px 28px rgba(18,168,95,.28);transition:--hd .7s cubic-bezier(.4,0,.2,1),--hm .7s cubic-bezier(.4,0,.2,1),--hl .7s cubic-bezier(.4,0,.2,1),--scr .7s ease,--hmc .7s ease,color .5s ease}
.htop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.hero{text-shadow:0 1px 2px rgba(0,0,0,.16)}
.hero.dark{color:#0b2b25;text-shadow:none}
.hero.dark .lbl{opacity:.75}
.hero .lbl{font-size:12.5px;opacity:.95;font-weight:500}
.hero .amt{font-size:36px;font-weight:600;letter-spacing:-.03em;margin:2px 0 14px;line-height:1.15}
.lblrow{display:flex;align-items:center;gap:6px}
.eye{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;margin:-4px 0;padding:0;border:0;border-radius:50%;background:transparent;color:inherit;opacity:.85;cursor:pointer;transition:background .2s ease,opacity .2s ease}
.eye:hover{background:rgba(255,255,255,.18);opacity:1}
.hero.dark .eye:hover{background:rgba(0,0,0,.08)}
.eye svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eye .slash{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s ease}
.masked .eye .slash{stroke-dashoffset:0}
.hero .amt,.split b,.shareline,.stamp small,.owe h2 small,.owe .pp b,.cat .row span:last-child,.day span:last-child,.tx .c,.mine,.part{transition:filter .35s ease,opacity .35s ease}
.masked .hero .amt,.masked .split b,.masked .shareline,.masked .stamp small,.masked .owe h2 small,.masked .owe .pp b,.masked .cat .row span:last-child,.masked .day span:last-child,.masked .tx .c,.masked .mine,.masked .part{filter:blur(.32em);opacity:.8;user-select:none}
.stamp{flex:none;transform:rotate(3deg);border:2px solid currentColor;border-radius:12px;padding:5px 11px;text-align:center;font-weight:600;font-size:12.5px;line-height:1.25;color:#055B4E;background:rgba(255,255,255,.92);text-shadow:none}
.stamp small{display:block;font-weight:400;font-size:10.5px;opacity:.9}
.stamp.warn{color:#a85f00}
.split{display:flex;gap:10px}
.split div{flex:1;border-radius:16px;padding:11px 13px;background:rgba(255,255,255,.92);color:#14171a;text-shadow:none;border:2px solid transparent}
.split div.btn{cursor:pointer}
.split div.on{border-color:#055B4E;background:#fff}
.split small{display:block;font-size:11.5px;color:#5b6470}
.split b{font-size:16px;font-weight:600}
.strip{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.strip .it{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.92);color:#14171a;text-shadow:none;cursor:pointer}
.strip .bd{font-size:11.5px;font-weight:600}
.strip .bd.warn{color:#a85f00}
.strip .bd.ok{color:#055B4E}
.seg{display:flex;background:var(--line);border-radius:999px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:8px 4px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.sec{background:var(--surface);border-radius:22px;padding:16px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.sec h2{font-size:13px;font-weight:600;color:var(--text);margin:0 0 12px}
.sec h2 small{font-weight:400;color:var(--muted);font-size:11.5px;margin-left:6px}
.cat{margin:12px 0}
.cat .row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;margin-bottom:6px}
.cat .row span:first-child{display:flex;align-items:center;gap:8px;font-weight:500}
.cat .row span:last-child{color:var(--muted);font-size:12.5px}
.track{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--bar);border-radius:99px}
.day{font-size:12px;color:var(--muted);font-weight:500;margin:16px 0 2px;display:flex;justify-content:space-between}
.day:first-of-type{margin-top:0}
.tx{display:flex;gap:12px;align-items:center;padding:11px 0;cursor:pointer}
.day + .tx{padding-top:8px}
.ico{flex:none;width:42px;height:42px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:19px}
.tx .l{flex:1;min-width:0}
.tx .n{font-size:14px;font-weight:500;overflow-wrap:anywhere;line-height:1.35}
.tx .note{font-size:12px;color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
.tx .rt{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tx .c{font-size:14.5px;font-weight:600;white-space:nowrap}
.pill{font-size:10.5px;font-weight:500;padding:2px 9px;border-radius:99px}
.pill.paid{background:var(--paid-soft);color:var(--paid)}
.pill.pending{background:var(--pending-soft);color:var(--pending)}
.msg{background:var(--surface);border-radius:18px;padding:16px;font-size:14px;line-height:1.55;margin-bottom:14px;box-shadow:var(--shadow)}
.msg b{display:block;margin-bottom:4px}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:18px 0}
.foot{text-align:center;font-size:11px;color:var(--muted);margin-top:16px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:28px;line-height:1;box-shadow:0 8px 22px rgba(18,161,80,.38);z-index:20}
.overlay{position:fixed;inset:0;background:rgba(10,14,12,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:560px;height:92%;border-radius:26px 26px 0 0;display:flex;flex-direction:column;overflow:hidden}
.panel.auto{height:auto;max-height:92%}
.phead{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px}
.phead b{font-size:17px;font-weight:600}
.scroller{flex:1;overflow-y:auto;padding:0 16px 12px;-webkit-overflow-scrolling:touch}
.bub{max-width:88%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;margin:8px 0;overflow-wrap:anywhere;white-space:pre-wrap}
.bub.me{margin-left:auto;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:6px}
.bub.ai{background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.bub.ok{background:var(--paid-soft);color:var(--paid);box-shadow:none}
.hint{font-size:13px;color:var(--muted);line-height:1.6;padding:6px 2px}
.dr{background:var(--surface);border-radius:20px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.dr .g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dr label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:500}
.dr .full{grid-column:1/-1}
.dr input,.dr select,.composer textarea{width:100%;font-size:14.5px;color:var(--text);background:var(--bg);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;outline:none}
.dr input:focus,.dr select:focus,.composer textarea:focus{border-color:var(--accent)}
.dr .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px}
.dr .rm{color:var(--muted);font-size:13px;padding:2px 6px}
.dup{color:var(--pending);font-size:12px;font-weight:500}
.savebar{padding:4px 0 8px}
.primary{width:100%;padding:14px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:15px}
.primary:disabled{opacity:.5}
.ghost{padding:9px 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);color:var(--muted);font-size:13px;font-weight:500}
.composer{background:var(--surface);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(20,23,26,.05)}
.composer textarea{resize:none;min-height:56px}
.crow{display:flex;align-items:center;gap:10px;margin-top:8px}
.attach{padding:9px 14px;border-radius:999px;background:var(--bg);font-size:13px;font-weight:500;cursor:pointer}
.crow .sub{flex:1;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.send{padding:10px 22px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:14px}
.send:disabled{opacity:.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:6px 14px;border-radius:999px;font-size:12px;line-height:1.4;z-index:40;display:flex;gap:12px;align-items:center;max-width:92%;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.toast[hidden]{display:none}
.toast span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.toast button{flex:none;font-weight:600;font-size:12px;text-decoration:underline;padding:0}
.due{margin:-2px 2px 14px}
.dtrack{height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.dfill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.dlbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;border:1.5px solid rgba(0,0,0,.2);vertical-align:baseline}
.parts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.part{font-size:11px;font-weight:500;padding:2px 9px;border-radius:99px;border:1px solid var(--pending);color:var(--pending);background:transparent}
.part.done{border-color:transparent;background:var(--paid-soft);color:var(--paid)}
.mine{font-size:11.5px;color:var(--muted);margin-top:2px}
.shareline{margin-top:12px;font-size:12px;font-weight:500}
.owe .pp{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.owe .pp:first-of-type{border-top:0}
.splitprev{font-size:11.5px;color:var(--muted);margin-top:4px}
.err{color:var(--pending);font-size:13px;padding:6px 2px}
.paybill{display:block;width:100%;margin-top:12px;padding:12px;border-radius:14px;background:#055B4E;color:#fff;font-weight:600;font-size:14px;text-shadow:none;transition:background .2s ease,color .2s ease}
.paybill.armed{background:#EBFF69;color:#055B4E;box-shadow:inset 0 0 0 2px #055B4E}
.paybill:disabled{background:rgba(255,255,255,.55);color:rgba(20,23,26,.6);font-weight:500;cursor:default}
.paybill.done{background:rgba(255,255,255,.92);color:#055B4E}
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;text-align:center}
.login[hidden]{display:none}
.login img{width:84px;height:84px;border-radius:20px}
.login h2{margin:0;font-size:22px}
.login .sub{max-width:300px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Card Dashboard</h1>
      <div class="sub" id="updated">กำลังโหลด…</div>
    </div>
    <button class="icon-btn" id="refresh" aria-label="Refresh">↻</button>
  </header>
  <div id="msg"></div>
  <div class="chips" id="chips"></div>
  <div class="cyc" id="cyc" hidden>
    <button id="prev" aria-label="Previous cycle">‹</button>
    <div class="mid" id="range"></div>
    <button id="next" aria-label="Next cycle">›</button>
  </div>
  <div class="due" id="due" hidden>
    <div class="dtrack"><div class="dfill" id="dfill"></div></div>
    <div class="dlbl"><span id="dl"></span><span id="dr"></span></div>
  </div>
  <div class="hero" id="hero" hidden></div>
  <div id="body"></div>
  <div class="foot">อ่านจาก Google Sheets · รีเฟรชอัตโนมัติทุก 1 นาที · เขียนเฉพาะตอนกดบันทึก</div>
</div>

<button class="fab" id="fab" aria-label="เพิ่มรายการ">＋</button>
<div class="overlay" id="sheet" hidden>
  <div class="panel" role="dialog" aria-label="เพิ่มรายการ">
    <div class="phead"><b>เพิ่มรายการ</b><button class="icon-btn" id="closeSheet" aria-label="Close">✕</button></div>
    <div class="scroller"><div id="draftBox"></div></div>
    <div class="composer">
      <div class="err" id="addMsg"></div>
      <button class="primary" id="saveBtn">บันทึก</button>
    </div>
  </div>
</div>
<div class="overlay" id="editSheet" hidden>
  <div class="panel auto" role="dialog" aria-label="แก้ไขรายการ">
    <div class="phead"><b>แก้ไขรายการ</b><button class="icon-btn" id="closeEdit" aria-label="Close">✕</button></div>
    <div class="scroller"><div id="editBody"></div><div class="err" id="editMsg"></div></div>
    <div class="composer"><button class="primary" id="editSave">บันทึกการแก้ไข</button></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<datalist id="merchants"></datalist>
<div class="login" id="login" hidden>
  <img src="apple-touch-icon.png" alt="">
  <h2>ChaiJaai</h2>
  <div class="sub" id="loginMsg">ล็อกอินด้วยบัญชี Google เพื่อดูข้อมูล</div>
  <div id="gbtn"></div>
</div>

  // ---------- Google sign-in ----------
  // ID token lives ~1 h; kept in localStorage so reopening the app within the hour skips the login screen.
  var waiting = null; // { promise, resolve } while the login screen is up
  function storedToken(){
    try {

    }
    var d = Math.round((cy.end - t) / 86400000);
    return { kind: "info", title: d === 0 ? "ตัดรอบวันนี้" : "ตัดรอบอีก " + d + " วัน", sub: dstr(cy.end) };
  }


  // ---------- Edit existing rows ----------
  var editing = null, editCopy = null, writing = false, toastTimer = null;
  function showToast(text, undoFn){
    var t = $("toast"); t.textContent = ""; t.appendChild(el("span", null, text));
    if (undoFn) { var u = el("button", null, "ย้อนกลับ"); u.onclick = function(){ t.hidden = true; undoFn(); }; t.appendChild(u); }
    t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.hidden = true; }, undoFn ? 7000 : 3500);
  }
  function writeErrCopy(e){
    if (e && e.code === "stale") return "แถวในชีทเปลี่ยนไป รีเฟรชแล้วลองใหม่";
    return "บันทึกไม่สำเร็จ: " + ((e && e.message) || "ไม่ทราบสาเหตุ");
  }
  // The server re-reads the row first and refuses to write if it no longer matches what the page showed.
  function updateRow(orig, vals, onlyStatus){
    return gs("updateRow", {
      row: orig.row,
      orig: { name: orig.name, cost: orig.cost, date: dfmt(orig.date) },
      vals: { name: vals.name, cost: vals.cost, date: vals.date ? dfmt(vals.date) : "", status: vals.status, category: vals.category, note: vals.note, card: vals.card, split: vals.split || "" },
      only: onlyStatus === true ? "status" : (onlyStatus || "")
    }).then(function(){ load(); });
  }
  function toggleStatus(r){
    if (writing) return;
    var prev = r.status, next = isPaid(r) ? "Pending" : "Paid";
    var snap = { name: r.name, cost: r.cost, date: r.date, row: r.row };
    writing = true; r.status = next; render();
    updateRow(snap, { status: next }, true).then(function(){
      showToast(r.name + " → " + next, function(){
        if (writing) return;
        writing = true;
        var cur = rowObj(snap.row) || r; cur.status = prev; render();
        updateRow(snap, { status: prev }, true).catch(function(e){ cur.status = next; render(); showToast(writeErrCopy(e)); }).then(function(){ writing = false; });
      });
    }).catch(function(e){ var cur = rowObj(snap.row) || r; cur.status = prev; r.status = prev; render(); showToast(writeErrCopy(e)); }).then(function(){ writing = false; });
  }
  // idx = -1 toggles my own share ("เรา ✓"). When every share is ticked the row flips to Paid;
  // un-ticking a fully settled row flips it back to Pending.
  function toggleSplit(r, idx){
    if (writing) return;
    var prev = r.split, prevStatus = r.status;
    var parts = r.parts.map(function(p){ return { name: p.name, amt: p.amt, done: p.done }; });
    var msg;
    if (idx < 0) {
      var had = meDone(parts);
      parts = others(parts);
      if (!had) parts.push({ name: ME, amt: null, done: true });
      msg = had ? "ส่วนของเรา → ยังไม่จ่าย" : "ส่วนของเราจ่ายแล้ว ✓";
    } else {
      parts[idx].done = !parts[idx].done;
      msg = parts[idx].name + (parts[idx].done ? " จ่ายคืนแล้ว ✓" : " → ยังไม่จ่าย");
    }
    var next = serializeSplit(parts);
    var wasAll = allSettled(r.parts), isAll = allSettled(parts);
    var nextStatus = isAll && !isPaid(r) ? "Paid" : (wasAll && !isAll && isPaid(r) ? "Pending" : null);
    var snap = { name: r.name, cost: r.cost, date: r.date, row: r.row };
    writing = true; r.split = next; r.parts = parts; if (nextStatus) r.status = nextStatus; render();
    var req = nextStatus ? updateRow(snap, { split: next, status: nextStatus }, "split_status") : updateRow(snap, { split: next }, "split");
    req.then(function(){
      showToast(msg + (nextStatus ? " · " + nextStatus : ""));
    }).catch(function(e){
      var cur = rowObj(snap.row) || r;
      cur.split = prev; cur.parts = parseSplit(prev); cur.status = prevStatus;
      r.split = prev; r.parts = parseSplit(prev); r.status = prevStatus;
      render(); showToast(writeErrCopy(e));
    }).then(function(){ writing = false; });
  }
  // "จ่ายบิลนี้" = the card's statement for this cycle was paid to the bank (recorded in the Bills tab).
  // It does not touch row statuses (Paid there means money was set aside). Only after the cycle has closed.
  // First tap arms the button, second tap (within 4s) confirms; tapping a paid bill offers to cancel it.
  var payArm = null;
  function payButton(cy, total){
    var b = el("button", "paybill");
    if (!(cy.end < today())) { b.disabled = true; b.textContent = "จ่ายบิลได้หลังตัดรอบ " + dstr(cy.end); return b; }
    var key = billKey(state.sel, cy.end), bill = (state.bills || {})[key], armed = payArm === key;
    if (!bill && total < 0.005) return null;
    if (bill) {
      b.classList.add("done");
      b.textContent = armed ? "แตะอีกครั้งเพื่อยกเลิกการจ่ายบิล" : "จ่ายบิลแล้ว ✓" + (bill.paidOn ? " · " + dstr(bill.paidOn) : "");
    } else {
      b.textContent = armed ? "แตะอีกครั้งเพื่อยืนยัน · ฿" + fmt(total) : "จ่ายบิลนี้ · ฿" + fmt(total);
    }
    if (armed) b.classList.add("armed");
    b.onclick = function(){
      if (writing) return;
      if (!armed) {
        payArm = key; render();
        setTimeout(function(){ if (payArm === key) { payArm = null; render(); } }, 4000);
        return;
      }
      payArm = null;
      setBill(state.sel, cy.end, total, !bill);
    };
    return b;
  }
  function setBill(card, end, amount, paid){
    if (writing) return;
    var key = billKey(card, end), prev = (state.bills || {})[key];
    state.bills = state.bills || {};
    writing = true;
    if (paid) state.bills[key] = { paidOn: today(), amount: amount }; else delete state.bills[key];
    render();
    gs("setBillPaid", { card: card, cycleEnd: dfmt(end), amount: amount, paid: paid }).then(function(){
      load();
      showToast(paid ? "จ่ายบิล " + card + " แล้ว ✓" : "ยกเลิกการจ่ายบิลแล้ว", paid ? function(){ setBill(card, end, amount, false); } : null);
    }).catch(function(e){
      if (prev) state.bills[key] = prev; else delete state.bills[key];
      render(); showToast(writeErrCopy(e));
    }).then(function(){ writing = false; });
  }
  function openEdit(r){
    editing = r;
    editCopy = { name: r.name, cost: r.cost, date: dfmt(r.date), status: isPaid(r) ? "Paid" : (r.status || "Pending"), category: r.cat, note: r.note, card: r.card, split: r.split || "" };
    var b = $("editBody"); b.textContent = ""; $("editMsg").textContent = "";
    var g = el("div", "dr"), gg = el("div", "g");
    gg.appendChild(field("List", textInput(editCopy, "name"), true));
    gg.appendChild(field("Cost", textInput(editCopy, "cost", "decimal")));
    gg.appendChild(field("วันที่ (dd/mm/yyyy)", textInput(editCopy, "date")));
    var stE = selectInput(editCopy, "status", STATUSES);
    editCopy._cardChanged = function(){ if (editCopy.card === state.cash) { editCopy.status = "Paid"; stE.value = "Paid"; } };
    gg.appendChild(field("Status", stE));
    gg.appendChild(field("Category", selectInput(editCopy, "category", CATS)));
    gg.appendChild(field("Card", selectInput(editCopy, "card", cardNames()), true));
    gg.appendChild(field("แบ่งกับ", splitField(editCopy), true));
    gg.appendChild(field("Note", textInput(editCopy, "note"), true));
    g.appendChild(gg); b.appendChild(g);
    $("editSave").disabled = false; $("editSave").textContent = "บันทึกการแก้ไข";
    $("editSheet").hidden = false; document.body.style.overflow = "hidden";
  }
  function closeEdit(){ $("editSheet").hidden = true; document.body.style.overflow = ""; editing = null; }
  function saveEdit(){
    if (!editing || writing) return;
    var c = editCopy, d = parseDate(c.date);
    if (!c.name || !isFinite(c.cost) || !d || !c.card) { $("editMsg").textContent = "ข้อมูลไม่ครบ (List, Cost, วันที่ หรือ Card)"; return; }
    var ns = normalizeSplit(c.cost, c.split); if (!ns.ok) { $("editMsg").textContent = ns.error; return; }
    var orig = { name: editing.name, cost: editing.cost, date: editing.date, row: editing.row };
    var target = editing;
    writing = true; $("editSave").disabled = true; $("editSave").textContent = "กำลังบันทึก…"; $("editMsg").textContent = "";
    updateRow(orig, { name: c.name, cost: c.cost, date: d, status: c.status, category: c.category, note: c.note, card: c.card, split: ns.text }, false).then(function(){
      target.name = c.name; target.cost = c.cost; target.date = d; target.status = c.status; target.cat = c.category; target.note = c.note; target.card = c.card; target.split = ns.text; target.parts = ns.parts;
      closeEdit(); render(); showToast("แก้ไขแล้ว ✓");
    }).catch(function(e){
      $("editMsg").textContent = writeErrCopy(e); $("editSave").disabled = false; $("editSave").textContent = "บันทึกการแก้ไข";
    }).then(function(){ writing = false; });
  }


  function setUpdated(){
    var t = state.storedAt ? new Date(state.storedAt) : new Date();
    $("updated").textContent = "อัปเดตล่าสุด " + t.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });
  }
  function fillMerchants(){
    var seen = {}, dl = $("merchants"); dl.textContent = "";
    (state.rows || []).slice().reverse().forEach(function(r){
      if (seen[r.name]) return; seen[r.name] = 1;
      var o = document.createElement("option"); o.value = r.name; dl.appendChild(o);
    });
  }
  function load(){
    return gs("getData").then(function(res){
      state.rows = parseRows(res.rows || []);
    state.cash = res.cash || state.cash;
    state.salaryDay = res.salaryDay || state.salaryDay;
      var c = parseCards(res.cards || []); if (c) state.cards = c;
      CARD_IMG = res.cardImg || CARD_IMG;
      state.bills = parseBills(res.bills || []);
      state.storedAt = res.at; showError(null); setUpdated(); fillMerchants(); render();
    }).catch(function(e){
      if (!state.rows) { showError(e); $("updated").textContent = "โหลดไม่สำเร็จ"; }
      else $("updated").textContent = "รีเฟรชไม่สำเร็จ · แสดงข้อมูลล่าสุดที่มี";
    }).then(function(){ $("refresh").classList.remove("spin"); });
  }

  // ---------- Manual add ----------
  var draft = [], saving = false, dupAck = false;
  var CATS = ["Food", "Transport", "Groceries", "Subscription", "Household", "Other"];
  var STATUSES = ["Pending", "Paid"];
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function dfmt(d){ return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear(); }
  function cardNames(){
    var names = Object.keys(state.cards);
    (state.rows || []).forEach(function(r){ if (r.card && r.card !== state.cash && names.indexOf(r.card) < 0) names.push(r.card); });
    names.push(state.cash);
    return names;
  }
  function sameDay(a, b){ return a && b && a.getTime() === b.getTime(); }
  function isDup(r){
    var d = parseDate(r.date);
    return !!(state.rows && state.rows.some(function(x){ return x.name === r.name && Math.abs(x.cost - r.cost) < 0.005 && sameDay(x.date, d) && x.card === r.card; }));
  }
  function rowObj(n){ return (state.rows || []).filter(function(x){ return x.row === n; })[0]; }

  function openSheet(){ if (!draft.length) addBlank(); else renderDraft(); $("sheet").hidden = false; document.body.style.overflow = "hidden"; }
  function closeSheet(){ $("sheet").hidden = true; document.body.style.overflow = ""; }
  function splitField(r){
    var w = document.createElement("div"), i = document.createElement("input"); i.type = "text";
    i.placeholder = "เช่น มิ้นท์ 450; ป้า 300 (หรือพิมพ์แค่ชื่อ = หารเท่ากัน)"; i.value = r.split || "";
    var pv = el("div", "splitprev", "");
    function upd(){
      r.split = i.value;
      if (!i.value.trim()) { pv.textContent = ""; return; }
      var n = normalizeSplit(isFinite(r.cost) ? r.cost : 0, i.value);
      pv.textContent = n.ok ? "แบ่ง " + (n.parts.length + 1) + " คน · ของเรา ฿" + fmt(n.mine) : "⚠ " + n.error;
    }
    i.oninput = upd; r._split = upd; w.appendChild(i); w.appendChild(pv); upd(); return w;
  }
  function field(label, node, full){
    var w = el("div", full ? "full" : null); w.appendChild(el("label", null, label)); w.appendChild(node); return w;
  }
  function textInput(r, key, mode){
    var i = document.createElement("input"); i.type = "text"; if (mode) i.inputMode = mode;
    i.value = r[key] == null ? "" : r[key];
    i.oninput = function(){ r[key] = key === "cost" ? parseFloat(String(i.value).replace(/,/g, "")) : i.value; if (r._dup) r._dup(); if (r._split) r._split(); };
    return i;
  }
  function selectInput(r, key, opts){
    var s = document.createElement("select");
    var list = opts.slice(); if (r[key] && list.indexOf(r[key]) < 0) list.push(r[key]); if (key === "card" && list.indexOf("") < 0) list.unshift("");
    list.forEach(function(o){ var op = document.createElement("option"); op.value = o; op.textContent = o === state.cash ? "เงินสด" : (o || "— เลือกบัตร —"); if (o === r[key]) op.selected = true; s.appendChild(op); });
    s.onchange = function(){ r[key] = s.value; if (r._dup) r._dup(); if (key === "card" && r._cardChanged) r._cardChanged(); };
    return s;
  }


  function renderDraft(){
    dupAck = false;
    var box = $("draftBox"); box.textContent = "";
    draft.forEach(function(r, i){
      var card = el("div", "dr");
      var top = el("div", "top"); var dup = el("span", "dup", "");
      var rm = el("button", "rm", "ลบ"); rm.onclick = function(){ draft.splice(i, 1); if (!draft.length) { closeSheet(); } else renderDraft(); };
      top.appendChild(dup); top.appendChild(rm); card.appendChild(top);
      r._dup = function(){ dup.textContent = isDup(r) ? "⚠ อาจซ้ำกับรายการที่มีอยู่แล้ว" : ""; };
      var g = el("div", "g");
      var nameIn = textInput(r, "name"); nameIn.setAttribute("list", "merchants"); nameIn.placeholder = "เช่น TMN 7-11";
      var catSel = selectInput(r, "category", CATS);
      // Picking a known merchant fills in the category it was last logged under.
      nameIn.onchange = function(){
        var hit = (state.rows || []).filter(function(x){ return x.name === r.name; }).sort(function(a, b){ return b.row - a.row; })[0];
        if (hit) { r.category = hit.cat; if (![].some.call(catSel.options, function(o){ return o.value === hit.cat; })) { var op = document.createElement("option"); op.value = hit.cat; op.textContent = hit.cat; catSel.appendChild(op); } catSel.value = hit.cat; }
        r._dup();
      };
      g.appendChild(field("List", nameIn, true));
      g.appendChild(field("Cost", textInput(r, "cost", "decimal")));
      g.appendChild(field("วันที่ (dd/mm/yyyy)", textInput(r, "date")));
      var stSel = selectInput(r, "status", STATUSES);
      r._cardChanged = function(){ if (r.card === state.cash) { r.status = "Paid"; stSel.value = "Paid"; } };
      g.appendChild(field("Status", stSel));
      g.appendChild(field("Category", catSel));
      g.appendChild(field("Card", selectInput(r, "card", cardNames()), true));
      g.appendChild(field("แบ่งกับ", splitField(r), true));
      g.appendChild(field("Note", textInput(r, "note"), true));
      card.appendChild(g); box.appendChild(card); r._dup();
    });
    var add = el("button", "ghost", "+ เพิ่มอีกแถว"); add.onclick = addBlank; box.appendChild(add);
    var sv = $("saveBtn"); sv.textContent = draft.length ? "บันทึก " + draft.length + " รายการลงชีท" : "บันทึก"; sv.disabled = saving || !draft.length;
    $("addMsg").textContent = "";
    var sc = box.parentNode; sc.scrollTop = sc.scrollHeight;
  }
  function addBlank(){
    var names = cardNames();
    var card0 = (state.sel && state.sel !== "All" && state.sel !== "Salary") ? state.sel : (names[0] || "");
draft.push({ name: "", cost: NaN, date: dfmt(today()), status: card0 === state.cash ? "Paid" : "Pending", category: "Food", note: "", split: "", card: card0 });
    renderDraft();
  }
  function saveDraft(){
    if (saving || !draft.length) return;
    var bad = draft.filter(function(r){ return !r.name || !isFinite(r.cost) || !parseDate(r.date) || !r.card; });
    if (bad.length) { $("addMsg").textContent = "ยังมีแถวที่ข้อมูลไม่ครบ (List, Cost, วันที่ หรือ Card)"; return; }
    var splitErr = null, splitTxt = draft.map(function(r){ var n = normalizeSplit(r.cost, r.split); if (!n.ok) splitErr = n.error; return n.text || ""; });
    if (splitErr) { $("addMsg").textContent = splitErr; return; }
    var dups = draft.filter(isDup).length;
    if (dups && !dupAck) {
      dupAck = true;
      $("addMsg").textContent = "มี " + dups + " รายการที่เหมือนรายการเดิมในชีททุกอย่าง ถ้าตั้งใจให้ซ้ำ กดอีกครั้งเพื่อยืนยัน";
      $("saveBtn").textContent = "ยืนยัน บันทึกซ้ำ";
      return;
    }
    dupAck = false; saving = true; $("saveBtn").disabled = true; $("saveBtn").textContent = "กำลังบันทึก…"; $("addMsg").textContent = "";
    var rows = draft.map(function(r, i){ return { split: splitTxt[i], name: r.name.trim(), cost: r.cost, date: dfmt(parseDate(r.date)), status: r.status, category: r.category, note: r.note || "", card: r.card }; });
    gs("addRows", rows).then(function(){
      var n = rows.length; draft = []; closeSheet(); showToast("บันทึกแล้ว " + n + " รายการ ✓"); return load();
    }).catch(function(e){
      $("addMsg").textContent = writeErrCopy(e) + (e && e.code === "stale" ? "" : " · รีเฟรชดูก่อนกดซ้ำ (กันซ้ำ)");
      load();
    }).then(function(){ saving = false; var b = $("saveBtn"); if (b) { b.disabled = !draft.length; if (draft.length) b.textContent = "บันทึก " + draft.length + " รายการลงชีท"; } });
  }

  $("prev").onclick = function(){ state.offset -= 1; render(); };
  $("next").onclick = function(){ if (state.offset < 0) { state.offset += 1; render(); } };
  $("refresh").onclick = function(){ $("refresh").classList.add("spin"); load(); };
  $("closeEdit").onclick = closeEdit;
  $("editSave").onclick = saveEdit;
  $("fab").onclick = openSheet;
  $("closeSheet").onclick = closeSheet;
  $("saveBtn").onclick = saveDraft;

  load();
  setInterval(function(){ if (!document.hidden && !writing && !saving) load(); }, 60000);
  document.addEventListener("visibilitychange", function(){ if (!document.hidden && !writing && !saving) load(); });
})();
</script>
</body>
</html>
