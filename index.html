<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f6f8;--surface:#ffffff;--text:#0f172a;--muted:#6b7684;--line:#e6eaef;
  --accent:#12a150;--on-accent:#ffffff;
  --paid:#12a150;--paid-soft:#e6f6ec;--pending:#e58a00;--pending-soft:#fff3de;--bar:#12a150;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.05);
  --font:"Poppins","IBM Plex Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#061316;--surface:#0d2024;--text:#ecfbf6;--muted:#82a09f;--line:#183135;
    --accent:#3ed68b;--on-accent:#04140c;
    --paid:#3ed68b;--paid-soft:#103427;--pending:#f2a93b;--pending-soft:#33260f;--bar:#3ed68b;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#061316;--surface:#0d2024;--text:#ecfbf6;--muted:#82a09f;--line:#183135;
  --accent:#3ed68b;--on-accent:#04140c;
  --paid:#3ed68b;--paid-soft:#103427;--pending:#f2a93b;--pending-soft:#33260f;--bar:#3ed68b;
  --shadow:none;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px calc(var(--tabbar-h) + 96px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:22px;margin:0;font-weight:600;letter-spacing:-.02em}
.sub{font-size:12px;color:var(--muted);margin-top:1px}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-size:17px}
.icon-btn.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 6px;margin-bottom:4px}
.chips[hidden]{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;font-weight:600;color:var(--text)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.hbtns{display:flex;gap:8px}
.icon-btn[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.cardpick{display:flex;align-items:center;gap:10px;max-width:100%;padding:6px 2px;margin:2px 0 8px;text-align:left}
.cardpick[hidden]{display:none}
.cardpick .nm{min-width:0;font-size:20px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cardpick .caret{color:var(--muted);font-size:11px;margin-left:-2px}
.wrap{overflow-x:clip}
.hero.swipe{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.dots{display:flex;justify-content:center;align-items:center;gap:6px;margin:-4px 0 14px;font-size:11.5px;color:var(--muted)}
.dots[hidden]{display:none}
.dots i{width:6px;height:6px;border-radius:99px;background:var(--line);transition:width .25s ease,background .25s ease}
.dots i.on{width:18px;background:var(--text)}
.clist{display:flex;flex-direction:column;gap:6px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.clist button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);text-align:left}
.clist button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.clist .txt{flex:1;min-width:0}
.clist .txt b{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clist .txt small{display:block;font-size:11.5px;color:var(--muted)}
.phead .acts{display:flex;align-items:center;gap:8px}
.pact{padding:8px 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:13px;font-weight:600;color:var(--accent)}
.addrow{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:14px;border-radius:16px;border:1.5px dashed var(--line-mid);color:var(--accent);font-size:14px;font-weight:600;background:transparent}
.clist .addrow{box-shadow:none;background:transparent;justify-content:center}
/* Manage sheets (instrument register): one grouped list, facts on every row, one primary action per sheet. */
:root{--r-control:12px;--r-media:14px;--r-sheet:20px;--line-mid:rgba(20,40,30,.16);
  --lift-1:0 0 0 1px rgba(20,40,30,.06),0 1px 2px rgba(20,40,30,.04);--lh-thai:1.65}
:root[data-theme="dark"]{--line-mid:rgba(200,255,240,.16);--lift-1:0 0 0 1px rgba(220,240,230,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--line-mid:rgba(200,255,240,.16);--lift-1:0 0 0 1px rgba(220,240,230,.07)}}
.glist{background:var(--surface);border-radius:var(--r-sheet);box-shadow:var(--lift-1);overflow:hidden}
.grow-row{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 14px;text-align:left;position:relative}
.grow-row+.grow-row::before{content:"";position:absolute;top:0;left:84px;right:0;height:1px;background:var(--line)}
.glist.cats .grow-row+.grow-row::before{left:62px}
.grow-row .txt{flex:1;min-width:0}
.grow-row .txt b{display:flex;align-items:center;gap:6px;font-size:14.5px;font-weight:600;line-height:1.35;overflow:hidden;white-space:nowrap}
.grow-row .txt b span{overflow:hidden;text-overflow:ellipsis}
.grow-row .txt small{display:block;font-size:12px;color:var(--muted);line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow-row .amt{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.grow-row .amt.zero{color:var(--muted);font-weight:500}
.grow-row .amt small{display:block;font-size:11.5px;font-weight:400;color:var(--muted)}
.grow-row .chev{flex:none;width:8px;height:8px;border-top:1.5px solid var(--muted);border-right:1.5px solid var(--muted);transform:rotate(45deg);margin:0 2px 0 4px;opacity:.7}
.flag{flex:none;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--line);color:var(--muted)}
.cc{width:58px;height:37px;border-radius:6px;flex:none;position:relative;overflow:hidden;box-shadow:0 0 0 1px rgba(20,40,30,.08)}
.cc img{width:100%;height:100%;object-fit:cover;display:block}
.cc.gen::before,.ccbig.gen::before{content:"";position:absolute;left:12%;top:24%;width:20%;height:22%;border-radius:2px;background:linear-gradient(135deg,#efdfae,#b8964a);opacity:.9}
.icsq{flex:none;width:36px;height:36px;border-radius:var(--r-control);background:var(--bg);display:grid;place-items:center;font-size:19px}
.mhint{font-size:12.5px;color:var(--muted);line-height:var(--lh-thai);margin:10px 4px 0}
.mempty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13.5px;line-height:var(--lh-thai)}
.mgr-seg{margin:0 0 12px}
.ccbig{position:relative;width:min(280px,100%);aspect-ratio:1.586;margin:2px auto 12px;border-radius:var(--r-media);overflow:hidden;color:#f4f7f2;box-shadow:0 10px 28px rgba(20,40,30,.18)}
.ccbig img{width:100%;height:100%;object-fit:cover;display:block}
.ccbig.gen::before{left:9%;top:22%;width:14%;height:17%;border-radius:4px}
.ccbig .nm{position:absolute;left:9%;bottom:12%;right:9%;font-size:17px;font-weight:600;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccbig .nm:empty::after{content:"ชื่อบัตร";opacity:.55}
.facts{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--surface);border-radius:var(--r-sheet);box-shadow:var(--lift-1);margin-bottom:12px}
.facts div{padding:10px 12px;min-width:0}
.facts div+div{border-left:1px solid var(--line)}
.facts small{display:block;font-size:11px;color:var(--muted)}
.facts b{display:block;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fgroup{background:var(--surface);border-radius:var(--r-sheet);padding:14px 16px 16px;box-shadow:var(--lift-1);margin-bottom:12px}
.fgroup .t{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;margin-bottom:10px}
.fgroup .t small{font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.fgroup .h{font-size:12px;color:var(--muted);margin-top:10px;line-height:var(--lh-thai)}
.fgroup input.txt{width:100%;font-size:15px;color:var(--text);padding:12px 14px;border-radius:var(--r-control);background:var(--bg);border:1.5px solid transparent;outline:none}
.fgroup input.txt:focus{border-color:var(--accent)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days button{height:36px;border-radius:10px;font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums;transition:background .15s ease}
.days button:active{transform:scale(.97)}
.days button[aria-pressed="true"]{background:var(--text);color:var(--bg);font-weight:600}
.swrow{display:flex;align-items:center;gap:12px}
.swrow .txt{flex:1;min-width:0}
.swrow .txt b{display:block;font-size:14px;font-weight:600}
.swrow .txt small{display:block;font-size:12px;color:var(--muted);line-height:var(--lh-thai)}
.sw{position:relative;flex:none;width:50px;height:30px;border-radius:999px;background:var(--line-mid);transition:background .2s ease}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(20,40,30,.25);transition:transform .2s ease}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.catprev{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r-sheet);box-shadow:var(--lift-1);padding:12px 14px;margin-bottom:12px}
.catprev .txt{flex:1;min-width:0}
.catprev .txt b{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catprev .txt small{display:block;font-size:12px;color:var(--muted)}
.emojis{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.emojis button{height:40px;border-radius:10px;font-size:19px}
.emojis button[aria-pressed="true"]{background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--text)}
.emoji-own{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.emoji-own input.txt{width:64px;flex:none;text-align:center;padding:9px}
.dr label.lact{display:flex;justify-content:space-between;align-items:baseline}
.dr label .act{color:var(--accent);font-weight:600;font-size:11.5px;cursor:pointer;padding:0 2px}
.clist .txt small.warn{color:var(--pending);font-weight:600}
.clist .txt small.ok{color:var(--paid)}
.clist .tot{font-size:14px;font-weight:600}
.cthumb{width:32px;height:20px;object-fit:cover;border-radius:3px;flex:none;display:block}
.cthumb.lg{width:44px;height:28px;border-radius:4px}
.cthumb.ph{background:var(--line)}
.cthumb.gen{position:relative;overflow:hidden}
.cthumb.sm{width:26px;height:16px}
.strip .nm{display:flex;align-items:center;gap:8px}
.cyc{display:flex;align-items:center;justify-content:space-between;padding:2px 2px;margin-bottom:12px}
.cyc button{width:38px;height:38px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-size:18px}
.cyc button:disabled{opacity:.35}
.cyc .mid{text-align:center;font-size:14px;font-weight:600}
.cyc .mid small{display:block;color:var(--muted);font-weight:400;font-size:11.5px;margin-top:1px}
@property --hd{syntax:'<percentage>';inherits:false;initial-value:0%}
@property --hm{syntax:'<percentage>';inherits:false;initial-value:60.74%}
@property --hl{syntax:'<percentage>';inherits:false;initial-value:100%}
@property --scr{syntax:'<number>';inherits:false;initial-value:.4}
@property --hmc{syntax:'<color>';inherits:false;initial-value:#12A85F}
.hero{position:relative;--hd:0%;--hm:60.74%;--hl:100%;--scr:.4;--hmc:#12A85F;background:linear-gradient(90deg,rgba(4,60,52,var(--scr)) 0%,rgba(4,60,52,var(--scr)) 45%,rgba(4,60,52,0) 80%),linear-gradient(90deg,#055B4E var(--hd),var(--hmc) var(--hm),#EBFF69 var(--hl));color:#fff;border-radius:24px;padding:20px 20px 18px;margin-bottom:14px;box-shadow:0 10px 28px rgba(18,168,95,.28);transition:--hd .7s cubic-bezier(.4,0,.2,1),--hm .7s cubic-bezier(.4,0,.2,1),--hl .7s cubic-bezier(.4,0,.2,1),--scr .7s ease,--hmc .7s ease,color .5s ease}
.htop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.hero{text-shadow:0 1px 2px rgba(0,0,0,.16)}
.hero.dark{color:#0b2b25;text-shadow:none}
.hero.dark .lbl{opacity:.75}
.hero .lbl{font-size:12.5px;opacity:.95;font-weight:500}
.hero .amt{font-size:36px;font-weight:600;letter-spacing:-.03em;margin:2px 0 14px;line-height:1.15}
.lblrow{display:flex;align-items:center;gap:6px}
.eye{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;margin:-4px 0;padding:0;border:0;border-radius:50%;background:transparent;color:inherit;opacity:.85;cursor:pointer;transition:background .2s ease,opacity .2s ease}
.eye:hover{background:rgba(255,255,255,.18);opacity:1}
.hero.dark .eye:hover{background:rgba(0,0,0,.08)}
.hero .amt,.split b,.shareline,.stamp small,.owe h2 small,.owe .pp b,.cat .row span:last-child,.day span:last-child,.tx .c,.mine,.part,.tot,.cat .dl{transition:filter .35s ease,opacity .35s ease}
.masked .hero .amt,.masked .split b,.masked .shareline,.masked .stamp small,.masked .owe h2 small,.masked .owe .pp b,.masked .cat .row span:last-child,.masked .day span:last-child,.masked .tx .c,.masked .mine,.masked .part,.masked .tot,.masked .cat .dl,.masked .clist .tot,.masked .cardpick .tot,.masked .clist small.warn{filter:blur(.32em);opacity:.8;user-select:none}
.stamp{flex:none;transform:rotate(3deg);border:2px solid currentColor;border-radius:12px;padding:5px 11px;text-align:center;font-weight:600;font-size:12.5px;line-height:1.25;color:#055B4E;background:rgba(255,255,255,.92);text-shadow:none}
.stamp small{display:block;font-weight:400;font-size:10.5px;opacity:.9}
.stamp.warn{color:#a85f00}
.split{display:flex;gap:10px}
.split div{flex:1;border-radius:16px;padding:11px 13px;background:rgba(255,255,255,.92);color:#14171a;text-shadow:none;border:2px solid transparent}
.split div.btn{cursor:pointer}
.split div.on{border-color:#055B4E;background:#fff}
.split small{display:block;font-size:11.5px;color:#5b6470}
.split b{font-size:16px;font-weight:600}
.strip{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.strip .it{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.92);color:#14171a;text-shadow:none;cursor:pointer}
.strip .bd{font-size:11.5px;font-weight:600}
.strip .bd.warn{color:#a85f00}
.strip .bd.ok{color:#055B4E}
.seg{display:flex;background:var(--line);border-radius:999px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:8px 4px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.sec{background:var(--surface);border-radius:22px;padding:16px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.sec h2{font-size:13px;font-weight:600;color:var(--text);margin:0 0 12px}
.sec h2 small{font-weight:400;color:var(--muted);font-size:11.5px;margin-left:6px}
.cat{margin:12px 0}
.cat .row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;margin-bottom:6px}
.cat .row span:first-child{display:flex;align-items:center;gap:8px;font-weight:500}
.cat .row span:last-child{color:var(--muted);font-size:12.5px}
.track{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--bar);border-radius:99px}
.cat .dl{font-size:11px;color:var(--muted);text-align:right;margin-top:3px}
.cat .dl.up{color:var(--pending)}
.cat .dl.down{color:var(--paid)}
.search{margin:0 0 12px}
.search[hidden]{display:none}
.search input{width:100%;font-size:16px;color:var(--text);background:var(--surface);border:1.5px solid transparent;border-radius:999px;padding:10px 16px;outline:none;box-shadow:var(--shadow)}
.search input:focus{border-color:var(--accent)}
.day{font-size:12px;color:var(--muted);font-weight:500;margin:16px 0 2px;display:flex;justify-content:space-between}
.day:first-of-type{margin-top:0}
.tx{display:flex;gap:12px;align-items:center;padding:11px 0;cursor:pointer}
.day + .tx{padding-top:8px}
.ico{flex:none;width:42px;height:42px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:19px}
.tx .l{flex:1;min-width:0}
.tx .n{font-size:14px;font-weight:500;overflow-wrap:anywhere;line-height:1.35}
.tx .note{font-size:12px;color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
/* card chip: hue/saturation per card (set inline as --h/--s), lightness per theme so it always reads */
:root{--chip-l:38%;--chip-a:.12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--chip-l:72%;--chip-a:.16}}
:root[data-theme="dark"]{--chip-l:72%;--chip-a:.16}
.cchip{display:inline-block;padding:0 7px;border-radius:99px;font-size:11px;font-weight:500;line-height:1.6;white-space:nowrap;vertical-align:1px;color:hsl(var(--h,0) var(--s,0%) var(--chip-l));background:hsl(var(--h,0) var(--s,0%) var(--chip-l) / var(--chip-a))}
.tx .rt{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tx .c{font-size:14.5px;font-weight:600;white-space:nowrap}
.pill{font-size:10.5px;font-weight:500;padding:2px 9px;border-radius:99px}
.pill.paid{background:var(--paid-soft);color:var(--paid)}
.pill.pending{background:var(--pending-soft);color:var(--pending)}
.msg{background:var(--surface);border-radius:18px;padding:16px;font-size:14px;line-height:1.55;margin-bottom:14px;box-shadow:var(--shadow)}
.msg b{display:block;margin-bottom:4px}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:18px 0}
.foot{text-align:center;font-size:11px;color:var(--muted);margin-top:16px}
.fab{position:fixed;right:18px;bottom:calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:28px;line-height:1;box-shadow:0 8px 22px rgba(18,161,80,.38);z-index:20}
.overlay{position:fixed;inset:0;background:rgba(10,14,12,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.overlay.slide:not([hidden]){animation:ovIn .22s ease}
.overlay.slide:not([hidden]) .panel{animation:panelIn .34s cubic-bezier(.22,1,.36,1)}
.overlay.slide.closing{animation:ovOut .2s ease forwards}
.overlay.slide.closing .panel{animation:panelOut .2s cubic-bezier(.4,0,1,1) forwards}

/* ---- Top view switcher: HeroUI v3 Tabs (grey track, sliding raised segment, hairline separators) ---- */
:root{--track:#e9edf1;--segment:#fff;--segment-shadow:0 2px 4px 0 rgba(0,0,0,.04),0 1px 2px 0 rgba(0,0,0,.06),0 0 1px 0 rgba(0,0,0,.06)}

#seg[hidden]{display:none}
#seg{position:relative;display:flex;flex-wrap:nowrap;gap:0;padding:4px;margin-bottom:12px;background:var(--track);border-radius:20px}

#seg .chip+.chip::before{content:"";position:absolute;left:0;top:25%;height:50%;width:1px;border-radius:1px;background:color-mix(in oklab,var(--muted) 25%,transparent);transition:opacity .15s ease}
#seg .chip[aria-pressed="true"]::before,#seg .chip[aria-pressed="true"]+.chip::before{opacity:0}
#seg .seg-ind{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;border-radius:999px;background:var(--segment);box-shadow:var(--segment-shadow);transition:transform .25s cubic-bezier(.32,.72,0,1),width .25s cubic-bezier(.32,.72,0,1)}

.fill.over{background:var(--pending)}
.bud-top .leg{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.flow{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px}
.flow div{display:flex;justify-content:space-between;padding:3px 0;font-variant-numeric:tabular-nums}
.flow div span:first-child{color:var(--muted)}
.flow div.eq{font-weight:600;border-top:1px dashed var(--line-mid);margin-top:4px;padding-top:7px}
.flow div.eq span:first-child{color:var(--text)}
.blabel{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;margin:18px 4px 8px}
.blabel small{font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.cat.btn{display:block;width:100%;padding:0;text-align:left;color:inherit}
.cat .dl.over{color:var(--pending)}
.unbud{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding-top:10px;border-top:1px solid var(--line);margin-top:4px;font-variant-numeric:tabular-nums}
.bud-add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;font-size:13.5px;font-weight:600;color:var(--accent)}
.bud-add .phi{width:17px;height:17px}
.grow-row.off{opacity:.5}
.amtin{font-variant-numeric:tabular-nums}
.confirm{box-shadow:var(--shadow),inset 0 0 0 1.5px color-mix(in oklab,var(--accent) 35%,transparent)}
.crow{display:flex;align-items:center;gap:10px;padding:8px 0}
.crow+.crow{border-top:1px solid var(--line)}
.crow .txt{flex:1;min-width:0}
.crow .txt b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .txt small{display:block;font-size:12px;color:var(--muted)}
.cin{width:96px;flex:none;font-size:15px;text-align:right;color:var(--text);padding:9px 10px;border-radius:var(--r-control);background:var(--bg);border:1.5px solid transparent;outline:none}
.cin:focus{border-color:var(--accent)}
.inc-hidden .cin.inc{filter:none;opacity:1;color:transparent;text-shadow:0 0 9px var(--text)}
.inc-hidden .cin.inc:focus{color:var(--text);text-shadow:none}
.cok{flex:none;padding:9px 12px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:600}
.cok:disabled{opacity:.6}
.est{font-size:11px;font-weight:500;color:var(--muted);background:var(--bg);border-radius:999px;padding:1px 7px;margin-left:2px}
.flow .lead{flex-wrap:wrap}
.est-t{color:var(--muted)!important}
.inc{transition:filter .35s ease,opacity .35s ease}
.inc-hidden .inc{filter:blur(.32em);opacity:.8;user-select:none;-webkit-user-select:none}
.blabel .lead,.flow .lead{display:flex;align-items:center;gap:4px}
.inc-eye{display:grid;place-items:center;width:30px;height:30px;margin:-8px 0;border-radius:999px;color:var(--muted)}
.inc-eye .phi{width:18px;height:18px}
</style>
</head>

        sr.appendChild(st); sr.appendChild(switchEl(!f.hidden, function(v){ f.hidden = !v; })); g3.appendChild(sr); b.appendChild(g3);
      }
    }, function(){
      if (isNew && !f.name) { $("itemMsg").textContent = "ใส่ชื่อหมวดก่อน"; return; }
      saveItem("saveCategory", { name: f.name, icon: f.icon, hidden: f.hidden, isNew: isNew }, isNew ? "เพิ่มหมวด " + f.name + " แล้ว" : "บันทึก " + f.name + " แล้ว");
    });
  }

  $("prev").onclick = function(){ state.offset -= 1; render(); };
  $("next").onclick = function(){ if (state.offset < 0) { state.offset += 1; render(); } };
  // ---------- Light / dark switch ----------
  // Follows the phone until tapped; the choice is then remembered (localStorage "theme"). The icon shows the mode a tap gives.
  var darkMQ = window.matchMedia("(prefers-color-scheme: dark)");
  function curTheme(){ return document.documentElement.dataset.theme || (darkMQ.matches ? "dark" : "light"); }
  function syncThemeBtn(){
    var dark = curTheme() === "dark", b = $("themeBtn");
    b.innerHTML = phSvg(dark ? "sun" : "moon"); b.setAttribute("aria-label", dark ? "เปลี่ยนเป็นโหมดสว่าง" : "เปลี่ยนเป็นโหมดมืด");
  }
  function setTheme(t){
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem("theme", t); } catch (e) {}
    syncThemeBtn();
  }
  $("themeBtn").onclick = function(){
    var next = curTheme() === "dark" ? "light" : "dark", root = document.documentElement;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return setTheme(next);
    if (document.startViewTransition) { document.startViewTransition(function(){ setTheme(next); }); return; }
    root.classList.add("theming"); setTheme(next);
    setTimeout(function(){ root.classList.remove("theming"); }, 500);
  };
  if (darkMQ.addEventListener) darkMQ.addEventListener("change", syncThemeBtn);
  syncThemeBtn();

  $("refresh").onclick = function(){ $("refresh").classList.add("spin"); load(); };
  $("closeEdit").onclick = closeEdit;
  $("editSave").onclick = saveEdit;
  $("editDel").onclick = deleteEdit;
  $("closeOwe").onclick = closeOwe;
  $("closeCards").onclick = closeCards;
  $("cardMgrBtn").onclick = function(){ closeCards(); openCardMgr(); };
  ["cardMgr", "catMgr", "itemSheet"].forEach(function(id){
    $("close-" + id).onclick = function(){ closeMgr(id); };
    $(id).onclick = function(e){ if (e.target === this) closeMgr(id); };
  });
  $("itemSave").onclick = function(){ if (itemSaveFn) itemSaveFn(); };
  $("cardMgrAdd").onclick = function(){ openCardEditor(null); };
  $("catMgrAdd").onclick = function(){ openCatEditor(null); };
  $("cardSheet").onclick = function(e){ if (e.target === this) closeCards(); };
  $("q").oninput = function(){ state.q = this.value.trim(); render(); };
  [].forEach.call(document.querySelectorAll(".tabbar button"), function(b){ b.onclick = function(){ if (state.rows) goTab(b.dataset.tab); }; });

  // ---------- Swipe the hero to change card ----------
  // The hero follows the finger; past the threshold it slides out, the next card renders, and the new hero slides in
  // from the other side. The cycle offset is kept so cards can be compared for the same period.
  (function(){
    var hero = $("hero"), x0 = 0, y0 = 0, t0 = 0, dx = 0, mode = null, busy = false, ease = "cubic-bezier(.22,1,.36,1)";
    var HERO_VARS = ["--hd", "--hm", "--hl", "--scr", "--hmc"];
    var HERO_TR = "--hd .7s cubic-bezier(.4,0,.2,1),--hm .7s cubic-bezier(.4,0,.2,1),--hl .7s cubic-bezier(.4,0,.2,1),--scr .7s ease,--hmc .7s ease,color .5s ease";
    function move(x, tr){ hero.style.transition = tr || "none"; hero.style.transform = x ? "translateX(" + x + "px)" : ""; }
    function done(){ hero.style.transition = ""; hero.style.transform = ""; busy = false; }
    hero.addEventListener("pointerdown", function(e){
      if (busy || !state.swipeCards || e.pointerType === "mouse" && e.button !== 0) return;
      x0 = e.clientX; y0 = e.clientY; t0 = e.timeStamp; dx = 0; mode = "maybe";
    });
    hero.addEventListener("pointermove", function(e){
      if (!mode) return;
      var mx = e.clientX - x0, my = e.clientY - y0;
      if (mode === "maybe") {
        if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
        if (Math.abs(mx) <= Math.abs(my)) { mode = null; return; } // vertical = page scroll
        mode = "drag"; hero.setPointerCapture(e.pointerId);
      }
      var names = state.swipeCards, i = names.indexOf(state.sel);
      var edge = (mx > 0 && i === 0) || (mx < 0 && i === names.length - 1);
      dx = edge ? mx * 0.3 : mx; // rubber-band at the first/last card
      move(dx);
    });
    function end(e){
      if (mode !== "drag") { mode = null; return; }
      mode = null;
      var names = state.swipeCards, i = names.indexOf(state.sel), w = hero.offsetWidth;
      var fast = Math.abs(dx) > 30 && Math.abs(dx) / Math.max(1, e.timeStamp - t0) > 0.5;
      var j = (Math.abs(dx) > w * 0.28 || fast) ? i + (dx < 0 ? 1 : -1) : i;
      if (e.type === "pointercancel" || j < 0 || j >= names.length || j === i) { move(0, "transform .3s " + ease); setTimeout(done, 300); return; }
      busy = true; var dir = dx < 0 ? -1 : 1;
      move(dir * (w + 24), "transform .18s ease-in");
      setTimeout(function(){
        // render() swaps the gradient instantly while the hero is off-screen, so put the old card's colours back
        // and let them blend into the new card's while it slides in (same timing as the .hero CSS transition).
        var old = HERO_VARS.map(function(v){ return hero.style.getPropertyValue(v); });
        state.sel = names[j]; render();
        var nu = HERO_VARS.map(function(v){ return hero.style.getPropertyValue(v); });
        move(-dir * (w + 24));
        HERO_VARS.forEach(function(v, k){ hero.style.setProperty(v, old[k]); });
        hero.offsetWidth; // commit the start position and colours before animating in
        move(0, "transform .32s " + ease + "," + HERO_TR);
        HERO_VARS.forEach(function(v, k){ hero.style.setProperty(v, nu[k]); });
        setTimeout(done, 320);
      }, 180);
    }
    hero.addEventListener("pointerup", end);
    hero.addEventListener("pointercancel", end);
    // A drag must not also count as a tap on the buttons inside the hero.
    hero.addEventListener("click", function(e){ if (Math.abs(dx) > 8) { e.stopPropagation(); e.preventDefault(); dx = 0; } }, true);
  })();
  $("fab").onclick = openSheet;
  $("closeSheet").onclick = closeSheet;
  $("saveBtn").onclick = saveDraft;

  load();
  setInterval(function(){ if (!document.hidden && !writing && !saving) load(); }, 60000);
  document.addEventListener("visibilitychange", function(){ if (!document.hidden && !writing && !saving) load(); });
})();
</script>
</body>
